name: circular_board
description: マルチテナント対応 回覧板アプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1

  # ルーティング
  go_router: ^13.2.0

  # HTTP クライアント
  dio: ^5.4.3

  # セキュアなトークン保存
  flutter_secure_storage: ^9.2.2

  # ファイル管理
  file_picker: ^8.0.0
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  pdfx: ^2.5.0
  flutter_pdfview: ^2.1.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
